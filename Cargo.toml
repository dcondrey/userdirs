[package]
name = "userdirs"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Cross-platform paths to the user's media and personal directories: downloads, documents, pictures, music, videos, desktop, fonts, templates, projects. No copyleft dependencies."
keywords = ["xdg", "downloads", "documents", "userdirs", "path"]
categories = ["filesystem", "os"]
readme = "README.md"
repository = "https://github.com/dcondrey/userdirs"
documentation = "https://docs.rs/userdirs"

[features]
# Adds `userdirs::cache`, a process-wide memoised snapshot. Opt-in at the call
# site as well as here: enabling the feature adds an API, it never changes what
# the free functions return. See the module docs for why.
cache = []

# docs.rs builds on Linux by default. Building the other targets too lets a
# reader switch platforms and see the Windows and macOS behaviour rendered.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"]

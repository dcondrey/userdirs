name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The Windows leg is the point of this matrix: the Known Folder API code
  # cannot be executed on a developer's macOS or Linux machine, so until this
  # runs, `SHGetKnownFolderPath` is compile-checked only.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo test --doc
      # The `cache` feature adds a process-wide static, so it needs exercising
      # on every OS, not just the one the default build covers.
      - run: cargo test --all-features --all-targets

  # Linux runners ship a real user-dirs.dirs only if xdg-user-dirs has run.
  # Generate one so the XDG resolution path is exercised end to end, not just
  # the parser.
  xdg-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y xdg-user-dirs
      - run: xdg-user-dirs-update --force
      - run: cat "${XDG_CONFIG_HOME:-$HOME/.config}/user-dirs.dirs"
      - run: cargo test --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo doc --all-features --no-deps

  # Cross-compile the platform modules that this runner cannot execute, so a
  # break in one is caught by every leg rather than only its own.
  cross-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - x86_64-unknown-freebsd
          # Neither Unix nor Windows: exercises the fallback module, without
          # which the crate does not build at all here.
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --target ${{ matrix.target }} --all-targets

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - run: cargo check --all-targets
